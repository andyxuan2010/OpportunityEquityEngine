name: Build and deploy Opportunity Equity Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: opportunity-appservice-main
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_FILE: src/OpportunityEquityEngine.Web/OpportunityEquityEngine.Web.csproj
  APP_SERVICE_NAME: app-opportunity-dev
  RESOURCE_GROUP_NAME: rg-opportunity-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${PROJECT_FILE}"

      - name: Build
        run: dotnet build "${PROJECT_FILE}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${PROJECT_FILE}" --configuration Release --output "${RUNNER_TEMP}/publish" --no-build

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-equity-engine-app
          path: ${{ runner.temp }}/publish
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: opportunity-dev

    steps:
      - name: Download published app
        uses: actions/download-artifact@v4
        with:
          name: opportunity-equity-engine-app
          path: ${{ runner.temp }}/publish

      - name: Sign in to Azure with service principal credentials
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          resource-group-name: ${{ env.RESOURCE_GROUP_NAME }}
          package: ${{ runner.temp }}/publish
