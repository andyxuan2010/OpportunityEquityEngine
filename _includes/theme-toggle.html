<script>
  (() => {
    const root = document.documentElement;
    const saved = localStorage.getItem('oee-theme');
    if (saved === 'dark') root.dataset.theme = 'dark';
    const button = document.querySelector('[data-theme-toggle]');
    if (!button) return;
    button.addEventListener('click', () => {
      const dark = root.dataset.theme !== 'dark';
      root.dataset.theme = dark ? 'dark' : 'light';
      localStorage.setItem('oee-theme', dark ? 'dark' : 'light');
      button.setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
    });
  })();
</script>
<script>
  (() => {
    const locale = '{{ page.locale | default: "en" }}';
    const suffix = locale === 'zh' ? '.CN' : '.FR';
    document.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href');
      if (!href || /^(?:[a-z]+:|\/\/|#)/i.test(href)) return;
      let target = href.replace(/\.md(?=($|#|\?))/i, '.html');
      if (!link.classList.contains('language-option') && locale !== 'en' && /\.html(?:$|#|\?)/i.test(target) && !/\.(?:CN|FR)\.html(?:$|#|\?)/i.test(target)) {
        target = target.replace(/\.html(?=($|#|\?))/i, `${suffix}.html`);
      }
      link.href = target;
    });
  })();
</script>
