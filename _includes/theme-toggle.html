<script>
  (() => {
    const root = document.documentElement;
    const saved = localStorage.getItem('oee-theme');
    if (saved === 'dark') root.dataset.theme = 'dark';
    const button = document.querySelector('[data-theme-toggle]');
    if (!button) return;
    button.addEventListener('click', () => {
      const dark = root.dataset.theme !== 'dark';
      root.dataset.theme = dark ? 'dark' : 'light';
      localStorage.setItem('oee-theme', dark ? 'dark' : 'light');
      button.setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
    });
  })();
</script>
<script>
  (() => {
    const locale = '{{ page.locale | default: "en" }}';
    if (locale === 'en') return;
    const suffix = locale === 'zh' ? '.CN' : '.FR';
    document.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href');
      if (!href || /^(?:[a-z]+:|\/\/|#)/i.test(href) || /\.(?:CN|FR)\.(?:md|html)(?:$|#|\?)/i.test(href)) return;
      if (/\.md(?:$|#|\?)/i.test(href)) link.href = href.replace(/\.md(?=($|#|\?))/i, `${suffix}.md`);
      else if (/\.html(?:$|#|\?)/i.test(href)) link.href = href.replace(/\.html(?=($|#|\?))/i, `${suffix}.html`);
    });
  })();
</script>
